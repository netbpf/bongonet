[package]
name = "bongonet-s2n"
version = "0.4.0"
license = "Apache-2.0"
edition = "2021"
repository = "https://github.com/netbpf/bongonet"
categories = ["asynchronous", "network-programming"]
keywords = ["async", "tls", "ssl", "bongonet"]
description = """
S2N async APIs for Bongonet.
"""

[lib]
name = "bongonet_s2n"
path = "src/lib.rs"

[dependencies]
bongonet-error = { version = "0.4.0", path = "../bongonet-error"}
ring = "0.17.12"
s2n-tls = "0.3"
s2n-tls-tokio = "0.3"
