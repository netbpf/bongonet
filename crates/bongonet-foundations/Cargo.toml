[package]
name = "bongonet-foundations"
version = "0.4.0"
authors = ["Bongonet Team at KhulnaSoft <bongonet@khulnasoft.com>"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.88"
repository = "https://github.com/netbpf/bongonet"
categories = ["asynchronous", "network-programming"]
keywords = ["async", "telemetry", "logging", "bongonet"]
description = """
Foundations telemetry integration for bongonet services.
"""

[lib]
name = "bongonet_foundations"
path = "src/lib.rs"

[dependencies]
bongonet-core = { version = "0.4.0", path = "../bongonet-core", default-features = false, optional = true }
# Adopt Foundations minor releases deliberately because they may raise the effective MSRV.
foundations = { version = "~5.12.0", default-features = false }
async-trait = { workspace = true, optional = true }
log = { workspace = true, optional = true }
parking_lot = { version = "0.12", optional = true }
sentry = { version = "0.36", default-features = false, optional = true }
slog = { version = "2", optional = true }
slog-stdlog = { version = "4", optional = true }
slog-scope = { version = "4", optional = true }

[features]
default = ["service", "telemetry-server"]
logging = ["foundations/logging", "dep:slog", "dep:slog-stdlog", "dep:slog-scope"]
memory-profiling = ["foundations/memory-profiling", "telemetry-server"]
metrics = ["foundations/metrics"]
sentry = ["foundations/sentry", "dep:sentry", "bongonet-core?/sentry"]
service = ["dep:async-trait", "dep:log", "dep:parking_lot", "dep:bongonet-core"]
tracing = ["foundations/tracing"]
telemetry-server = ["foundations/telemetry-server", "metrics"]
full = ["logging", "memory-profiling", "sentry", "service", "tracing", "telemetry-server"]

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
