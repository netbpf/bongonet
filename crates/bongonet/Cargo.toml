[package]
name = "bongonet"
version = "0.4.0"
authors = ["Md Sulaiman <ceo@khulnasoft.com>"]
license = "Apache-2.0"
edition = "2021"
repository = "https://github.com/netbpf/bongonet"
description = """
A framework to build fast, reliable and programmable networked systems at Internet scale.
"""
categories = ["asynchronous", "network-programming"]
keywords = ["async", "proxy", "http", "bongonet"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "bongonet"
path = "src/lib.rs"

[package.metadata.docs.rs]
features = ["document-features"]
rustc-args = ["--cfg", "tokio_unstable"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bongonet-core = { version = "0.4.0", path = "../bongonet-core", default-features = false }
bongonet-http = { version = "0.4.0", path = "../bongonet-http" }
bongonet-timeout = { version = "0.4.0", path = "../bongonet-timeout" }
bongonet-load-balancing = { version = "0.4.0", path = "../bongonet-load-balancing", optional = true, default-features = false }
bongonet-proxy = { version = "0.4.0", path = "../bongonet-proxy", optional = true, default-features = false }
bongonet-cache = { version = "0.4.0", path = "../bongonet-cache", optional = true, default-features = false }


# Only used for documenting features, but doesn't work in any other dependency
# group :(
document-features = { version = "0.2.10", optional = true }

[dev-dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
env_logger = "0.11"
reqwest = { version = "0.12", features = ["rustls-tls", "http2"], default-features = false }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2"] }
http-body-util = "0.1"
async-trait = { workspace = true }
http = { workspace = true }
log = { workspace = true }
bongonet-prometheus = { version = "0.4.0", path = "../bongonet-prometheus" }
prometheus = "0.14"
once_cell = { workspace = true }
bytes = { workspace = true }
regex = "1"

[target.'cfg(unix)'.dev-dependencies]
hyperlocal = "0.9"
# Match foundations' allocator so workspace all-features tests link one jemalloc.
jemallocator = { package = "tikv-jemallocator", version = "0.6" }

[features]
default = []

#! ### Tls
#! Tls is provided by adding one of these features. If no tls-providing feature
#! is added, only unencrypted http. Only one tls-providing feature can be
#! selected at a time

## Use [OpenSSL](https://crates.io/crates/openssl) for tls
##
## Requires native openssl libraries and build tooling
openssl = [
    "bongonet-core/openssl",
    "bongonet-proxy?/openssl",
    "bongonet-cache?/openssl",
    "bongonet-load-balancing?/openssl",
    "openssl_derived",
]

## Use [BoringSSL](https://crates.io/crates/boring) for tls
##
## Requires native boring libraries and build tooling
boringssl = [
    "bongonet-core/boringssl",
    "bongonet-proxy?/boringssl",
    "bongonet-cache?/boringssl",
    "bongonet-load-balancing?/boringssl",
    "openssl_derived",
]

## Use  [s2n-tls](https://crates.io/crates/s2n-tls) for tls
##
## Requires native s2n-tls libraries and build tooling
s2n = [
    "bongonet-core/s2n",
    "bongonet-proxy?/s2n",
    "bongonet-cache?/s2n",
    "bongonet-load-balancing?/s2n",
    "any_tls",
]

## Use  [rustls](https://crates.io/crates/rustls) for tls
##
## ⚠️ _Highly Experimental_! ⚠️ Try it, but don't rely on it (yet)
rustls = [
    "bongonet-core/rustls",
    "bongonet-proxy?/rustls",
    "bongonet-cache?/rustls",
    "bongonet-load-balancing?/rustls",
    "any_tls",
]

#! ### Bongonet extensions

## Include the [proxy](crate::proxy) module
##
## This feature will include and export `bongonet_proxy::prelude::*`
proxy = ["bongonet-proxy"]

## Include the [lb](crate::lb) (load-balancing) module
##
## This feature will include and export `bongonet_load_balancing::prelude::*`
lb = ["bongonet-load-balancing", "proxy"]

## Include the [cache](crate::cache) module
##
## This feature will include and export `bongonet_cache::prelude::*`
cache = ["bongonet-cache"]

## Enable time/scheduling functionality
time = []

## Enable sentry for error notifications
sentry = ["bongonet-core/sentry"]

## Enable dial9 Tokio runtime telemetry configuration.
##
## Requires building with `--cfg tokio_unstable`.
dial9 = ["bongonet-core/dial9"]

## Enable dial9 S3-compatible trace segment upload support.
dial9-worker-s3 = ["dial9", "bongonet-core/dial9-worker-s3"]

## Enable dial9 CPU profiling support.
##
## Usable stack traces require building with `-C force-frame-pointers=yes`.
dial9-cpu-profiling = ["dial9", "bongonet-core/dial9-cpu-profiling"]

## Enable upstream modules: the `adjust_upstream_modules` callback, the
## `upstream_modules_ctx` on Session, and `init_upstream_modules` on ProxyHttp.
##
## Allows registering custom upstream modules that process response tasks
## before `upstream_compression`, and configuring them.
upstream_modules = ["bongonet-proxy?/upstream_modules"]

## Enable pre-TLS connection filtering
connection_filter = [
    "bongonet-core/connection_filter",
    "bongonet-proxy?/connection_filter",
]

## Enable buffering the full request body before `upstream_peer`, via the
## `early_request_body_buffer_limit`, `early_request_body_buffer_timeout`, and
## `early_request_body_filter` trait hooks.
early_body_buffer = ["bongonet-proxy?/early_body_buffer"]


# These features are intentionally not documented
openssl_derived = ["any_tls"]
any_tls = []
patched_http1 = ["bongonet-core/patched_http1", "bongonet-proxy?/patched_http1"]
document-features = [
    "dep:document-features",
    "proxy",
    "lb",
    "cache",
    "time",
    "sentry",
    "dial9",
    "dial9-worker-s3",
    "dial9-cpu-profiling",
    "connection_filter",
    "early_body_buffer"
]
trace = ["bongonet-cache?/trace", "bongonet-proxy?/trace"]

[lints]
workspace = true
