[package]
name = "bongonet-header-serde"
version = "0.4.0"
authors = ["Md Sulaiman <ceo@khulnasoft.com>"]
license = "Apache-2.0"
edition = "2021"
repository = "https://github.com/netbpf/bongonet"
categories = ["compression"]
keywords = ["http", "compression", "bongonet"]
exclude = ["samples/*"]
description = """
HTTP header (de)serialization and compression for Bongonet.
"""

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "bongonet_header_serde"
path = "src/lib.rs"

[[bin]]
name = "trainer"
path = "src/trainer.rs"

[dependencies]
zstd = "0.14.3"
zstd-safe = { version = "8.2.0", features = ["std"] }
http = { workspace = true }
bytes = { workspace = true }
bongonet-error = { version = "0.4.0", path = "../bongonet-error" }
bongonet-http = { version = "0.4.0", path = "../bongonet-http" }
bongonet-http-parser = { workspace = true }
thread_local = "1.0"

[lints]
workspace = true
