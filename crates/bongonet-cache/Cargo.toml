[package]
name = "bongonet-cache"
version = "0.4.0"
authors = ["Md Sulaiman <ceo@khulnasoft.com>"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/netbpf/bongonet"
categories = ["asynchronous", "network-programming"]
keywords = ["async", "http", "cache"]
description = """
HTTP caching APIs for Bongonet proxy.
"""

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "bongonet_cache"
path = "src/lib.rs"

[dependencies]
bongonet-core = { version = "0.4.0", path = "../bongonet-core", default-features = false }
bongonet-error = { version = "0.4.0", path = "../bongonet-error" }
bongonet-header-serde = { version = "0.4.0", path = "../bongonet-header-serde" }
bongonet-http = { version = "0.4.0", path = "../bongonet-http" }
bongonet-lru = { version = "0.4.0", path = "../bongonet-lru" }
bongonet-timeout = { version = "0.4.0", path = "../bongonet-timeout" }
bstr = { workspace = true }
http = { workspace = true }
indexmap = "1"
once_cell = { workspace = true }
regex = "1"
blake2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3.0"
bytes = { workspace = true }
httpdate = "1.0.2"
log = { workspace = true }
async-trait = { workspace = true }
parking_lot = "0.12"
cf-rustracing = { version = "1.0", optional = true }
cf-rustracing-jaeger = { version = "1.0", optional = true }
rmp = "0.8.14"
tokio = { workspace = true }
lru = { workspace = true }
ahash = { workspace = true }
hex = "0.4"
bongonet-http-parser = { workspace = true }
strum = { version = "0.26", features = ["derive"] }
rand = "0.8"
arrayvec = "0.7"

[dev-dependencies]
cf-rustracing = "1.0"
cf-rustracing-jaeger = "1.0"
tokio-test = "0.4"
tokio = { workspace = true, features = ["fs"] }
env_logger = "0.11"
dhat = "0"
futures = { workspace = true }

[[bench]]
name = "simple_lru_memory"
harness = false

[[bench]]
name = "lru_memory"
harness = false

[[bench]]
name = "lru_serde"
harness = false

[features]
default = []
openssl = ["bongonet-core/openssl"]
boringssl = ["bongonet-core/boringssl"]
rustls = ["bongonet-core/rustls"]
s2n = ["bongonet-core/s2n"]
trace = ["dep:cf-rustracing", "dep:cf-rustracing-jaeger"]

[lints]
workspace = true
