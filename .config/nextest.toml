# These integration binaries bind fixed ports in each nextest process.
[test-groups]
bongonet-fixed-port-integration = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(bongonet-core) & binary(test_basic)'
test-group = 'bongonet-fixed-port-integration'

[[profile.default.overrides]]
filter = 'package(bongonet-proxy) & (binary(test_basic) | binary(test_upstream))'
test-group = 'bongonet-fixed-port-integration'
