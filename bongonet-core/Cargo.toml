[package]
name = "bongonet-core"
version = "0.4.0"
authors = ["Md Sulaiman <ceo@khulnasoft.com>"]
license = "Apache-2.0"
edition = "2021"
repository = "https://github.com/netbpf/bongonet"
categories = ["asynchronous", "network-programming"]
keywords = ["async", "http", "network", "bongonet"]
exclude = ["tests/*"]
description = """
Bongonet's APIs and traits for the core network protocols.
"""

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "bongonet_core"
path = "src/lib.rs"

[dependencies]
bongonet-runtime = { version = "0.4.0", path = "../bongonet-runtime" }
bongonet-openssl = { version = "0.4.0", path = "../bongonet-openssl", optional = true }
bongonet-boringssl = { version = "0.4.0", path = "../bongonet-boringssl", optional = true }
bongonet-pool = { version = "0.4.0", path = "../bongonet-pool" }
bongonet-error = { version = "0.4.0", path = "../bongonet-error" }
bongonet-timeout = { version = "0.4.0", path = "../bongonet-timeout" }
bongonet-http = { version = "0.4.0", path = "../bongonet-http" }
bongonet-http-parser = { workspace = true }
bongonet-rustls = { version = "0.4.0", path = "../bongonet-rustls", optional = true }
bongonet-s2n = { version = "0.4.0", path = "../bongonet-s2n", optional = true }
bstr = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true, optional = true }
futures = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
log = { workspace = true }
h2 = { workspace = true }
derivative.workspace = true
clap = { version = "4.5", features = ["derive"] }
once_cell = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
strum = "0.26.2"
strum_macros = "0.26.2"
libc = "0.2.70"
chrono = { version = "~0.4.31", features = ["alloc"], default-features = false }
sentry = { version = "0.36", features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
], default-features = false, optional = true }
regex = "1"
percent-encoding = "2.1"
parking_lot = { version = "0.12", features = ["arc_lock"] }
socket2 = { version = ">=0.4, <1.0.0", features = ["all"] }
flate2 = { version = "1", features = ["zlib-ng"], default-features = false }
sfv = "0.10.4"
rand = "0.8"
ahash = { workspace = true }
unicase = "2"
brotli = "3"
openssl-probe = "0.1.6"
tokio-test = "0.4"
zstd = "0.14.3"
httpdate = "1"
x509-parser = { version = "0.16.0", optional = true }
ouroboros = { version = "0.18.4", optional = true }
lru = { workspace = true, optional = true }
daggy = "0.8"

[target.'cfg(unix)'.dependencies]
flurry = "0.5"
daemonix = "0.1.0"
nix = { version = "~0.31.1", features = ["socket", "net", "fs", "uio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
httparse = { workspace = true }
criterion = { version = "0.7", features = ["async_tokio"] }
h2 = { workspace = true, features = ["unstable"] }
tokio-stream = { version = "0.1", features = ["full"] }
env_logger = "0.11"
reqwest = { version = "0.12", features = [
    "rustls-tls",
    "http2",
], default-features = false }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2"] }
http-body-util = "0.1"
rstest = "0.23.0"
# Only used for types in tests; the crypto provider arrives through
# bongonet-rustls, so no provider feature is selected here.
rustls = { version = "0.23", default-features = false, features = [
    "logging",
    "std",
    "tls12",
] }

[[bench]]
name = "h1_pipelining"
harness = false

[target.'cfg(unix)'.dev-dependencies]
hyperlocal = "0.9"
# Match foundations' allocator so workspace all-features tests link one jemalloc.
jemallocator = { package = "tikv-jemallocator", version = "0.6" }

[features]
default = []
# Requires building with `--cfg tokio_unstable`.
dial9 = ["bongonet-runtime/dial9"]
dial9-worker-s3 = ["dial9", "bongonet-runtime/dial9-worker-s3"]
dial9-cpu-profiling = ["dial9", "bongonet-runtime/dial9-cpu-profiling"]
openssl = ["bongonet-openssl", "openssl_derived"]
boringssl = ["bongonet-boringssl", "openssl_derived"]
rustls = ["bongonet-rustls", "any_tls", "dep:x509-parser", "ouroboros"]
s2n = ["bongonet-s2n", "any_tls", "dep:x509-parser", "ouroboros", "lru"]
patched_http1 = ["bongonet-http/patched_http1", "bongonet-http-parser/patched_http1"]
openssl_derived = ["any_tls"]
any_tls = ["dep:tokio-util"]
sentry = ["dep:sentry"]
connection_filter = []
