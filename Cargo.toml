




[workspace]
resolver = "2"
members = [
    "bongonet",
    "bongonet-core",
    "bongonet-pool",
    "bongonet-error",
    "bongonet-limits",
    "bongonet-timeout",
    "bongonet-header-serde",
    "bongonet-proxy",
    "bongonet-cache",
    "bongonet-http",
    "bongonet-http-parser",
    "bongonet-lru",
    "bongonet-openssl",
    "bongonet-boringssl",
    "bongonet-runtime",
    "bongonet-rustls",
    "bongonet-s2n",
    "bongonet-ketama",
    "bongonet-load-balancing",
    "bongonet-memory-cache",
    "bongonet-prometheus",
    "bongonet-foundations",
    "bongonet-test-utils",
    "tinyufo",
]

[workspace.dependencies]
bstr = "1.12.0"
tokio = "1"
tokio-stream = { version = "0.1" }
tokio-util = { version = "0.7.12", features = ["rt"] }
async-trait = "0.1.42"
httparse = "1"
bongonet-http-parser = { version = "0.4.0", path = "bongonet-http-parser" }
bytes = "1.0"
derivative = "2.2.0"
http = "1"
log = "0.4"
futures = "0.3"
h2 = ">=0.4.16"
once_cell = "1"
lru = "0.18.2"
ahash = ">=0.8.9"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[profile.bench]
debug = true
